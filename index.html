<!DOCTYPE html>
<html>
<head>
  <title>Epanouir</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #dce35b, #45b649);
      color: #333;
    }

    header {
      text-align: center;
      padding: 50px 20px;
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: 1px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 18px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    textarea, input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      margin-top: 12px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #45b649;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #379f3d;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Epanouir 🌿</h1>
    <p>Your personal growth dashboard</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>📝 Journal</h2>
      <textarea rows="5" placeholder="Write your thoughts here..."></textarea>
      <button>Save Entry</button>
    </div>

    <div class="card">
      <h2>✅ To-Do List</h2>
      <input type="text" id="taskInput" placeholder="Add a task...">
      <button onclick="addTask()">Add Task</button>
      <ul id="taskList"></ul>
    </div>

    <div class="card">
      <h2>📅 Planner</h2>
      <input type="date">
    </div>

  </div>

  <script>
    function addTask() {
      const input = document.getElementById("taskInput");
      const taskText = input.value.trim();

      if (taskText === "") return;

      const li = document.createElement("li");
      li.textContent = taskText;

      document.getElementById("taskList").appendChild(li);
      input.value = "";
    }
  </script>

</body>
</html>
