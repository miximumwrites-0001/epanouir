<!DOCTYPE html>
<html>
<head>
  <title>Epanouir</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #dce35b, #45b649);
      color: #333;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 40px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    textarea, input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #45b649;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #379f3d;
    }
  </style>
</head>

<body>

  <header>
    <h1>Epanouir 🌿</h1>
    <p>Your personal growth space</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>📝 Journal</h2>
      <textarea rows="5" placeholder="Write your thoughts here..."></textarea>
      <button>Save</button>
    </div>

    <div class="card">
      <h2>✅ To-Do List</h2>
      <input type="text" placeholder="Add a task...">
      <button>Add Task</button>
    </div>

    <div class="card">
      <h2>📅 Planner</h2>
      <input type="date">
    </div>

  </div>

</body>
</html>
